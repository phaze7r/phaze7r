<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Thesis: Geospatial Tagging of Volunteered Place Descriptions — an FP-Growth and Bayesian Elastic Net approach">
