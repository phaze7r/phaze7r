<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="phaze7r — Founder of Texodus INC, Lead AI Software Engineer">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .node{animation:glow 3.4s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
    .edge{stroke-dasharray:4 6;animation:dash 6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-100}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1000" height="300" rx="14" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="999" height="299" rx="13.5" fill="none" stroke="#2e2e2e"/>
  <g stroke="#1a1a1a" stroke-width="1">
    <path d="M0 60H1000M0 120H1000M0 180H1000M0 240H1000"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300"/>
  </g>
  <g stroke="#8c8c8c" stroke-width="1.3" fill="none" class="edge">
    <path d="M640 70L760 130L880 80"/><path d="M640 70L740 210L880 190"/>
    <path d="M760 130L740 210"/><path d="M760 130L880 190"/><path d="M880 80L880 190"/>
    <path d="M740 210L830 262L930 240"/><path d="M880 190L930 240"/>
  </g>
  <g fill="#0a0a0a" stroke="#f2f2f2" stroke-width="2">
    <circle class="node" cx="640" cy="70" r="8"/><circle class="node" cx="760" cy="130" r="11" style="animation-delay:.6s"/>
    <circle class="node" cx="880" cy="80" r="8" style="animation-delay:1.2s"/><circle class="node" cx="740" cy="210" r="11" style="animation-delay:1.8s"/>
    <circle class="node" cx="880" cy="190" r="13" style="animation-delay:2.4s"/><circle class="node" cx="830" cy="262" r="7" style="animation-delay:.9s"/>
    <circle class="node" cx="930" cy="240" r="9" style="animation-delay:1.5s"/>
  </g>
  <g fill="#f2f2f2"><circle cx="760" cy="130" r="4"/><circle cx="740" cy="210" r="4"/><circle cx="880" cy="190" r="5"/></g>
  <g>
    <text class="mono rise" x="56" y="82" font-size="14" letter-spacing="1.5" fill="#9a9a9a">~/phaze7r</text>
    <text class="rise d1" x="56" y="150" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#f2f2f2">phaze7r</text>
    <text class="rise d2" x="58" y="190" font-size="20" fill="#d4d4d4">Founder, <tspan fill="#ffffff" font-weight="600">Texodus INC ©</tspan> · Lead AI Software Engineer</text>
    <text class="mono rise d3" x="58" y="240" font-size="15" fill="#9a9a9a"><tspan fill="#ffffff">$</tspan> now: thesis on geospatial tagging of place descriptions<tspan class="cursor" fill="#f2f2f2"> ▍</tspan></text>
  </g>
</svg>
