name: Metrics

on:
  schedule:
    - cron: "23 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Keep the generated SVG off main: it lives on its own orphan branch.
      - uses: actions/checkout@v4
      - name: Ensure metrics branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan metrics
            git rm -rf . >/dev/null 2>&1 || true
            echo "Generated by lowlighter/metrics. Do not edit." > README.md
            git add README.md
            git commit -m "chore: init metrics branch"
            git push origin metrics
          fi
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: terminal
          filename: metrics.svg
          committer_branch: metrics
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_lines: yes
